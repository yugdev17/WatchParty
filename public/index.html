<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Party</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- SCREEN 1: Username + Choice -->
    <div id="screen-lobby" class="screen">
        <div class="lobby-card">
            <div class="brand">
                <span class="brand-icon">🎬</span>
                <span class="brand-name">Watch Party</span>
            </div>

            <div id="invite-banner" class="invite-banner hidden">
                ✨ You've been invited to join <strong id="invite-room-code"></strong>
            </div>

            <h1 class="lobby-title" id="lobby-title">What's your name?</h1>
            <input type="text" id="username-input" class="input-field" placeholder="Enter your name" required autocomplete="off">
            
            <div id="lobby-actions" class="lobby-actions">
                <button id="create-btn" class="btn btn-primary">Create Room</button>
                <button id="show-enter-code-btn" class="btn btn-secondary">Enter Code</button>
            </div>

            <div id="enter-code-section" class="hidden">
                <input type="text" id="room-code-input" class="input-field code-input" placeholder="ENTER CODE" maxlength="6" autocomplete="off">
                <div class="lobby-actions">
                    <button id="back-btn" class="btn btn-secondary">Back</button>
                    <button id="join-btn" class="btn btn-primary">Join Room</button>
                </div>
            </div>

            <p id="error-msg" class="error-msg"></p>
        </div>
    </div>

    <!-- SCREEN 2: Room -->
    <div id="room-view" class="room-layout hidden">
        <header class="room-header">
            <div class="header-left">
                <span class="brand-icon small">🎬</span>
                <span class="room-code-label">Room</span>
                <span id="display-room-code" class="room-code"></span>
                <button id="copy-invite-btn" class="icon-btn" title="Copy Invite Link">🔗</button>
            </div>
            <div class="header-right">
                <span class="users-label">👥</span>
                <ul id="user-list" class="header-user-list"></ul>
            </div>
        </header>

        <div class="room-body">
            <div class="video-area">
                <video id="video-player" controls>Your browser does not support HTML5 video.</video>
                
                <!-- Emoji bar below video -->
                <div class="emoji-bar" id="emoji-bar">
                    <button class="emoji-btn" data-emoji="❤️">❤️</button>
                    <button class="emoji-btn" data-emoji="😂">😂</button>
                    <button class="emoji-btn" data-emoji="😮">😮</button>
                    <button class="emoji-btn" data-emoji="🔥">🔥</button>
                    <button class="emoji-btn" data-emoji="👍">👍</button>
                    <button class="emoji-btn" data-emoji="😢">😢</button>
                </div>

                <div class="video-input-row">
                    <input type="text" id="video-url-input" class="input-field" placeholder="Paste a direct video URL (.mp4)">
                    <button id="load-video-btn" class="btn btn-primary small">Load</button>
                </div>

                <button id="leave-btn" class="btn btn-danger small full-width">Leave Room</button>
            </div>

            <aside class="side-panel">
                <div class="panel-tabs">
                    <button class="panel-tab active" data-tab="chat">💬 Chat</button>
                    <button class="panel-tab" data-tab="search">🔍 Movies</button>
                    <button class="panel-tab" data-tab="playlist">🎬 Playlist</button>
                </div>

                <!-- Chat Tab -->
                <div class="panel-content active" id="tab-chat">
                    <div class="chat-messages" id="chat-messages"></div>
                    <div class="chat-input-area">
                        <input type="text" id="chat-input" class="input-field" placeholder="Type a message...">
                        <button id="send-chat-btn" class="btn btn-primary small">➤</button>
                    </div>
                </div>

                <!-- Search Tab -->
                <div class="panel-content" id="tab-search">
                    <div class="search-input-area">
                        <input type="text" id="search-input" class="input-field" placeholder="Search movies...">
                    </div>
                    <div class="category-tabs" id="category-tabs">
                        <button class="cat-tab active" data-category="trending">🔥 Trending</button>
                        <button class="cat-tab" data-category="popular">⭐ Popular</button>
                        <button class="cat-tab" data-category="top_rated">🏆 Top</button>
                        <button class="cat-tab" data-category="now_playing">🎭 Now</button>
                    </div>
                    <div class="genre-filter">
                        <select id="genre-select">
                            <option value="">All Genres</option>
                        </select>
                    </div>
                    <div class="search-results" id="search-results">
                        <p class="muted-text">Loading...</p>
                    </div>
                </div>

                <!-- Playlist Tab -->
                <div class="panel-content" id="tab-playlist">
                    <div class="playlist-items" id="playlist-items">
                        <p class="muted-text">No movies yet. Add from the Movies tab!</p>
                    </div>
                </div>
            </aside>
        </div>

        <div class="reaction-overlay" id="reaction-overlay"></div>
    </div>

    <!-- Trailer Modal -->
    <div id="trailer-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="trailer-title">Trailer</h3>
                <button id="close-modal-btn" class="icon-btn">✕</button>
            </div>
        <div id="trailer-frame"></div>
        <div id="trailer-loading" class="trailer-loading">Loading trailer…</div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
    <script>
        window.onYouTubeIframeAPIReady = function() {
            window.ytApiReady = true;
            if (window.pendingTrailerKey) {
                window.buildYtPlayer(window.pendingTrailerKey);
                window.pendingTrailerKey = null;
            }
        };
    </script>
    <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
