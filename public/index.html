<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Party</title>
    <style>
        body { background-color: #1a1a1a; color: white; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .container { background-color: #2a2a2a; padding: 30px; border-radius: 10px; text-align: center; width: 100%; max-width: 1200px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        input { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #444; background-color: #333; color: white; }
        button { padding: 10px 20px; margin: 5px; border: none; border-radius: 5px; background-color: #4CAF50; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #45a049; }
        .hidden { display: none !important; }
        .main-layout { display: flex; gap: 20px; margin-top: 20px; text-align: left; }
        .video-section { flex: 3; }
        .side-panel { flex: 2; display: flex; flex-direction: column; gap: 15px; height: 700px; }
        .panel-box { display: flex; flex-direction: column; background: #222; border-radius: 10px; padding: 15px; overflow: hidden; }
        .search-section { flex: 1; }
        .playlist-section { flex: 1; }
        .chat-section { flex: 1.2; }
        video { width: 100%; border-radius: 10px; background: black; }
        .video-controls { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; }
        .video-controls input { flex-grow: 1; margin: 0; min-width: 150px; }
        .custom-controls { display: flex; gap: 10px; margin-top: 10px; }
        .custom-controls button { flex: 1; padding: 15px; font-size: 16px; background-color: #ff9800; }
        .chat-messages { flex-grow: 1; overflow-y: auto; margin-bottom: 10px; display: flex; flex-direction: column; gap: 5px; font-size: 0.9em; }
        .chat-msg { padding: 5px 10px; background: #333; border-radius: 5px; word-wrap: break-word; }
        .chat-msg .name { color: #4CAF50; font-weight: bold; font-size: 0.85em; margin-right: 5px; }
        .chat-msg .time { color: #888; font-size: 0.7em; float: right; margin-top: 3px; }
        .chat-input-area { display: flex; gap: 5px; }
        .chat-input-area input { margin: 0; flex-grow: 1; }
        .chat-input-area button { margin: 0; padding: 10px; }
        .search-input-area { display: flex; gap: 5px; margin-bottom: 10px; }
        .search-input-area input { margin: 0; flex-grow: 1; }
        .search-results { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .movie-result { display: flex; gap: 8px; background: #333; padding: 6px; border-radius: 5px; cursor: pointer; transition: background 0.2s; }
        .movie-result:hover { background: #444; }
        .movie-result img { width: 40px; height: 60px; border-radius: 3px; object-fit: cover; background: #111; }
        .movie-result-info { flex: 1; overflow: hidden; }
        .movie-result-info h4 { margin: 0 0 3px 0; font-size: 0.85em; color: #fff; }
        .movie-result-info p { margin: 0; font-size: 0.7em; color: #aaa; line-height: 1.2; max-height: 2.8em; overflow: hidden; }
        .add-btn { background-color: #4CAF50; padding: 4px 8px; font-size: 0.75em; margin: 0; align-self: center; }
        .playlist-items { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .playlist-item { display: flex; gap: 8px; background: #333; padding: 6px; border-radius: 5px; align-items: center; }
        .playlist-item img { width: 35px; height: 52px; border-radius: 3px; object-fit: cover; background: #111; }
        .playlist-item-info { flex: 1; overflow: hidden; }
        .playlist-item-info h4 { margin: 0 0 2px 0; font-size: 0.85em; color: #fff; }
        .playlist-item-info span { font-size: 0.7em; color: #aaa; }
        .playlist-item-actions { display: flex; flex-direction: column; gap: 3px; }
        .playlist-item-actions button { padding: 4px 6px; font-size: 0.7em; margin: 0; }
        .user-list { list-style: none; padding: 0; text-align: left; max-height: 60px; overflow-y: auto; margin: 10px 0 0 0; }
        .user-list li { padding: 4px; background: #333; margin: 2px 0; border-radius: 5px; font-size: 0.85em; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #1a1a1a; padding: 20px; border-radius: 10px; width: 90%; max-width: 900px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .modal-header h3 { margin: 0; }
        #trailer-frame { width: 100%; aspect-ratio: 16 / 9; border-radius: 10px; background: black; border: none; }
    </style>
</head>
<body>

    <div id="lobby-view" class="container">
        <h1>Watch Party</h1>
        <input type="text" id="username-input" placeholder="Enter your name" required>
        <button id="create-btn">Create Room</button>
        <hr style="border-color: #444; margin: 20px 0;">
        <input type="text" id="room-code-input" placeholder="Enter Room Code">
        <button id="join-btn">Join Room</button>
        <p id="error-msg" style="color: #ff5555; margin-top: 10px;"></p>
    </div>

    <div id="room-view" class="container hidden">
        <h1>Room: <span id="display-room-code"></span></h1>
        <div class="main-layout">
            <div class="video-section">
                <div class="video-controls">
                    <input type="text" id="video-url-input" placeholder="Paste a direct video URL (.mp4)">
                    <button id="load-video-btn">Load Video</button>
                    <button id="force-sync-btn" style="background-color: #2196F3;">Force Sync</button>
                </div>
                <div class="custom-controls">
                    <button id="play-pause-btn">Play / Pause</button>
                </div>
                <video id="video-player" controls>Your browser does not support HTML5 video.</video>
                <div>
                    <h3>Users in Room:</h3>
                    <ul id="user-list" class="user-list"></ul>
                </div>
            </div>
            <div class="side-panel">
                <div class="panel-box search-section">
                    <h3 style="margin-top: 0;">🔍 Find a Movie</h3>
                    <div class="search-input-area"><input type="text" id="search-input" placeholder="Search movies..."></div>
                    <div class="search-results" id="search-results">
                        <p style="color: #888; font-size: 0.85em;">Start typing to search...</p>
                    </div>
                </div>
                <div class="panel-box playlist-section">
                    <h3 style="margin-top: 0;">🎬 Shared Playlist</h3>
                    <div class="playlist-items" id="playlist-items">
                        <p style="color: #888; font-size: 0.85em;">No movies in playlist yet. Add some!</p>
                    </div>
                </div>
                <div class="panel-box chat-section">
                    <h3 style="margin-top: 0;">💬 Live Chat</h3>
                    <div class="chat-messages" id="chat-messages"></div>
                    <div class="chat-input-area">
                        <input type="text" id="chat-input" placeholder="Type a message...">
                        <button id="send-chat-btn">Send</button>
                    </div>
                </div>
            </div>
        </div>
        <button id="leave-btn" style="background-color: #ff5555; margin-top: 20px; width: 100%;">Leave Room</button>
    </div>

    <div id="trailer-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="trailer-title">Trailer</h3>
                <button id="close-modal-btn" style="background-color: #ff5555;">✕ Close</button>
            </div>
            <div id="trailer-frame"></div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        window.onYouTubeIframeAPIReady = function() {
            window.ytApiReady = true;
            if (window.pendingTrailerKey) {
                buildYtPlayer(window.pendingTrailerKey);
                window.pendingTrailerKey = null;
            }
        };
    </script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        const socket = io();

        const lobbyView = document.getElementById('lobby-view');
        const roomView = document.getElementById('room-view');
        const usernameInput = document.getElementById('username-input');
        const roomCodeInput = document.getElementById('room-code-input');
        const createBtn = document.getElementById('create-btn');
        const joinBtn = document.getElementById('join-btn');
        const errorMsg = document.getElementById('error-msg');
        const displayRoomCode = document.getElementById('display-room-code');
        const userList = document.getElementById('user-list');
        const videoPlayer = document.getElementById('video-player');
        const videoUrlInput = document.getElementById('video-url-input');
        const loadVideoBtn = document.getElementById('load-video-btn');
        const forceSyncBtn = document.getElementById('force-sync-btn');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const chatMessages = document.getElementById('chat-messages');
        const chatInput = document.getElementById('chat-input');
        const sendChatBtn = document.getElementById('send-chat-btn');
        const searchInput = document.getElementById('search-input');
        const searchResults = document.getElementById('search-results');
        const playlistItems = document.getElementById('playlist-items');
        const trailerModal = document.getElementById('trailer-modal');
        const trailerTitle = document.getElementById('trailer-title');
        const closeModalBtn = document.getElementById('close-modal-btn');

        let currentRoomCode = '';
        let isHost = false;
        let syncLock = false;
        let isBuffering = false;

        let ytPlayer = null;
        let isRemoteTrailerAction = false;

        // --- LOBBY ---
        createBtn.addEventListener('click', () => {
            const username = usernameInput.value.trim();
            if (!username) return alert('Please enter a name!');
            socket.emit('create-room', { username });
        });

        joinBtn.addEventListener('click', () => {
            const username = usernameInput.value.trim();
            const roomCode = roomCodeInput.value.trim().toUpperCase();
            if (!username) return alert('Please enter a name!');
            if (!roomCode) return alert('Please enter a room code!');
            socket.emit('join-room', { username, roomCode });
        });

        socket.on('room-created', (roomCode) => { currentRoomCode = roomCode; showRoomView(roomCode); });
        socket.on('room-joined', (roomCode) => { currentRoomCode = roomCode; showRoomView(roomCode); });
        socket.on('is-host', (status) => { isHost = status; });

        socket.on('user-list', (users) => {
            userList.innerHTML = '';
            users.forEach(user => {
                const li = document.createElement('li');
                li.textContent = user.name;
                userList.appendChild(li);
            });
        });

        socket.on('error-message', (msg) => {
            errorMsg.textContent = msg;
            if (msg.toLowerCase().includes('trailer')) alert(msg);
        });

        function showRoomView(roomCode) {
            lobbyView.classList.add('hidden');
            roomView.classList.remove('hidden');
            displayRoomCode.textContent = roomCode;
            errorMsg.textContent = '';
        }

        // --- MOVIE SEARCH ---
        let searchTimeout;
        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimeout);
            const query = searchInput.value.trim();
            if (query.length < 2) {
                searchResults.innerHTML = '<p style="color: #888; font-size: 0.85em;">Start typing to search...</p>';
                return;
            }
            searchTimeout = setTimeout(() => socket.emit('search-movies', { query }), 400);
        });

        socket.on('search-results', (results) => {
            searchResults.innerHTML = '';
            if (results.length === 0) {
                searchResults.innerHTML = '<p style="color: #888; font-size: 0.85em;">No movies found.</p>';
                return;
            }
            results.forEach(movie => {
                const div = document.createElement('div');
                div.className = 'movie-result';
                div.innerHTML = `
                    <img src="${movie.poster || 'https://via.placeholder.com/40x60/333/888?text=?'}" alt="${movie.title}">
                    <div class="movie-result-info">
                        <h4>${movie.title} <span style="color:#888;font-weight:normal;">(${movie.year})</span></h4>
                        <p>${movie.overview}</p>
                    </div>
                    <button class="add-btn">+ Add</button>
                `;
                div.addEventListener('click', () => {
                    socket.emit('add-to-playlist', { roomCode: currentRoomCode, movie });
                    div.style.opacity = '0.5';
                    setTimeout(() => { div.style.opacity = '1'; }, 300);
                });
                searchResults.appendChild(div);
            });
        });

        // --- PLAYLIST ---
        socket.on('playlist-updated', (playlist) => {
            playlistItems.innerHTML = '';
            if (playlist.length === 0) {
                playlistItems.innerHTML = '<p style="color: #888; font-size: 0.85em;">No movies in playlist yet. Add some!</p>';
                return;
            }
            playlist.forEach(movie => {
                const div = document.createElement('div');
                div.className = 'playlist-item';
                div.innerHTML = `
                    <img src="${movie.poster || 'https://via.placeholder.com/35x52/333/888?text=?'}" alt="${movie.title}">
                    <div class="playlist-item-info">
                        <h4>${movie.title}</h4>
                        <span>${movie.year} • added by ${movie.addedBy || 'user'}</span>
                    </div>
                    <div class="playlist-item-actions">
                        <button class="play-trailer-btn" style="background-color: #e91e63;">▶ Trailer</button>
                        <button class="remove-btn" style="background-color: #555;">✕ Remove</button>
                    </div>
                `;
                div.querySelector('.play-trailer-btn').addEventListener('click', () => {
                    socket.emit('play-trailer', { roomCode: currentRoomCode, movieId: movie.id });
                });
                div.querySelector('.remove-btn').addEventListener('click', () => {
                    socket.emit('remove-from-playlist', { roomCode: currentRoomCode, movieId: movie.id });
                });
                playlistItems.appendChild(div);
            });
        });

        // --- TRAILER SYNC ---
        socket.on('show-trailer', ({ title, key }) => {
            trailerTitle.textContent = `▶ ${title}`;
            trailerModal.classList.remove('hidden');

            if (window.ytApiReady) {
                buildYtPlayer(key);
            } else {
                window.pendingTrailerKey = key;
            }
        });

        function buildYtPlayer(videoKey) {
            if (ytPlayer && typeof ytPlayer.loadVideoById === 'function') {
                ytPlayer.loadVideoById(videoKey);
                return;
            }
            setTimeout(() => {
                ytPlayer = new YT.Player('trailer-frame', {
                    videoId: videoKey,
                    playerVars: {
                        autoplay: 1,
                        origin: window.location.origin,
                        enablejsapi: 1
                    },
                    events: {
                        'onReady': (event) => event.target.playVideo(),
                        'onStateChange': onYtStateChange,
                        'onError': (e) => console.error('YouTube Player Error:', e.data)
                    }
                });
            }, 200);
        }

        function onYtStateChange(event) {
            if (isRemoteTrailerAction) return;
            if (event.data === 1) {
                socket.emit('trailer-state-change', { roomCode: currentRoomCode, isPlaying: true, currentTime: ytPlayer.getCurrentTime() });
            } else if (event.data === 2) {
                socket.emit('trailer-state-change', { roomCode: currentRoomCode, isPlaying: false, currentTime: ytPlayer.getCurrentTime() });
            }
        }

        socket.on('trailer-state-change', ({ isPlaying }) => {
            if (!ytPlayer) return;
            isRemoteTrailerAction = true;
            if (isPlaying) ytPlayer.playVideo();
            else ytPlayer.pauseVideo();
            setTimeout(() => { isRemoteTrailerAction = false; }, 500);
        });

        closeModalBtn.addEventListener('click', () => {
            if (ytPlayer) ytPlayer.stopVideo();
            trailerModal.classList.add('hidden');
        });

        // --- CHAT ---
        sendChatBtn.addEventListener('click', sendChat);
        chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendChat(); });

        function sendChat() {
            const message = chatInput.value.trim();
            if (!message) return;
            socket.emit('chat-message', { roomCode: currentRoomCode, message });
            chatInput.value = '';
        }

        socket.on('chat-history', (messages) => {
            chatMessages.innerHTML = '';
            messages.forEach(msg => addChatMessage(msg));
            scrollToBottom();
        });

        socket.on('chat-message', (data) => { addChatMessage(data); scrollToBottom(); });

        function addChatMessage(data) {
            const div = document.createElement('div');
            div.className = 'chat-msg';
            div.innerHTML = `<span class="name">${data.username}</span>${data.message}<span class="time">${data.time}</span>`;
            chatMessages.appendChild(div);
        }

        function scrollToBottom() { chatMessages.scrollTop = chatMessages.scrollHeight; }

        // --- VIDEO PLAYER ---
        loadVideoBtn.addEventListener('click', () => {
            const url = videoUrlInput.value.trim();
            if (!url) return alert('Please enter a video URL');
            socket.emit('change-video', { roomCode: currentRoomCode, url });
        });

        forceSyncBtn.addEventListener('click', () => socket.emit('request-sync', { roomCode: currentRoomCode }));

        playPauseBtn.addEventListener('click', () => {
            if (videoPlayer.paused) videoPlayer.play();
            else videoPlayer.pause();
        });

        socket.on('video-changed', (url) => {
            syncLock = true;
            videoPlayer.src = url;
            videoPlayer.load();
            setTimeout(() => { syncLock = false; }, 500);
        });

        socket.on('sync-video-state', (state) => {
            if (state.url) {
                syncLock = true;
                videoPlayer.src = state.url;
                videoPlayer.currentTime = state.currentTime;
                if (state.isPlaying) videoPlayer.play().catch(e => console.log('Autoplay blocked'));
                setTimeout(() => { syncLock = false; }, 500);
            }
        });

        videoPlayer.addEventListener('waiting', () => { isBuffering = true; });
        videoPlayer.addEventListener('playing', () => { isBuffering = false; });

        videoPlayer.addEventListener('play', () => {
            if (syncLock || isBuffering) return;
            socket.emit('play-video', { roomCode: currentRoomCode, currentTime: videoPlayer.currentTime });
        });

        videoPlayer.addEventListener('pause', () => {
            if (syncLock || isBuffering) return;
            socket.emit('pause-video', { roomCode: currentRoomCode, currentTime: videoPlayer.currentTime });
        });

        videoPlayer.addEventListener('seeked', () => {
            if (syncLock || isBuffering) return;
            socket.emit('seek-video', { roomCode: currentRoomCode, currentTime: videoPlayer.currentTime });
        });

        socket.on('play-video', (time) => {
            syncLock = true;
            if (Math.abs(videoPlayer.currentTime - time) > 1.0) videoPlayer.currentTime = time;
            videoPlayer.play().catch(e => console.log('Autoplay blocked'));
            setTimeout(() => { syncLock = false; }, 500);
        });

        socket.on('pause-video', (time) => {
            syncLock = true;
            videoPlayer.currentTime = time;
            videoPlayer.pause();
            setTimeout(() => { syncLock = false; }, 500);
        });

        socket.on('seek-video', (time) => {
            syncLock = true;
            videoPlayer.currentTime = time;
            setTimeout(() => { syncLock = false; }, 500);
        });

        setInterval(() => {
            if (isHost && !videoPlayer.paused && !isBuffering && !syncLock && currentRoomCode) {
                socket.emit('sync-time', { roomCode: currentRoomCode, currentTime: videoPlayer.currentTime });
            }
        }, 4000);

        socket.on('sync-time', (hostTime) => {
            if (!isHost && !videoPlayer.paused && !isBuffering && !syncLock) {
                const drift = Math.abs(videoPlayer.currentTime - hostTime);
                if (drift > 1.5) {
                    syncLock = true;
                    videoPlayer.currentTime = hostTime;
                    setTimeout(() => { syncLock = false; }, 500);
                }
            }
        });

        document.getElementById('leave-btn').addEventListener('click', () => { window.location.reload(); });
    </script>
</body>
</html>
